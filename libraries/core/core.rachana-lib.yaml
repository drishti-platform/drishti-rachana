    - {"name": "live-table", "majors": [1], "category": "tables", "summary": "A live table of the host, read a window at a time and kept current by key, optionally with the host's edits.", "tags": ["live", "blotter", "edit", "stream", "table"], "needs": {"language": "1.2"}, "params": {"rows": {"type": "table", "required": true, "live": "ok", "key": "required", "doc": "The live table (a data entry with table and key), one row per record", "columns": {"key": {"type": "text", "optional": true, "doc": "The row's key"}}}, "columns": {"type": "columns", "required": true, "doc": "The columns: a list of { label, bind: \"@.field\", fmt, tone }, each reading one field"}, "order": {"type": "id", "required": true, "doc": "The field the rows are ordered by (a time or a version)"}, "direction": {"type": "enum", "options": ["desc", "asc"], "default": "desc", "doc": "The order's direction: desc (newest first, new rows on top) or asc"}, "edit": {"type": "enum", "options": ["none", "cells", "beside"], "default": "none", "doc": "How the host's edits are offered: none (read only), cells (in the grid) or beside (a record panel)"}, "title": {"type": "text", "default": "Live table", "doc": "The panel's title"}, "window": {"type": "integer", "default": 200, "min": 1, "max": 5000, "doc": "The rows read and followed at a time"}}, "contract": [{"param": "rows", "required": true, "columns": {"key": {"type": "text", "optional": true, "doc": "The row's key"}}}]}
