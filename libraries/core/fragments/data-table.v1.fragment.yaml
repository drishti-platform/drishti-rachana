rachana: 1.2
fragment: data-table
version: 1
doc:
  summary: A sortable, searchable table of rows with the columns you give, totals and a row event.
  description: >-
    Use it to show any list of records with the columns you choose: it sorts, searches and can total a column, and a click on a
    row raises an event. For a grid grouped by a hierarchy use tree-table; for a ranking of one measure use ranked-bars.
  category: tables
  use-when:
    - "A list of records is shown with chosen columns, sorting, search and totals."
    - No more specific fragment fits the rows.
  avoid-when:
    - "The rows form a hierarchy: use core/tree-table or core/drill-table."
    - "One measure is ranked: use core/ranked-bars."
  data:
    table: rows
    in-words: "Any rows; you name the columns to show, each a label and an expression over the row."
    sample-row: { ORDER_ID: A1, AMT_USD: 120 }
  example: { use: core/data-table@1, with: { rows: "$.orders", columns: [{ label: Order, bind: "@.ORDER_ID" }, { label: Amount, bind: "@.AMT_USD", fmt: amount0, total: true }] } }
  see-also: [core/drill-table, core/tree-table, core/ranked-bars, core/live-table]
  keywords: [table, grid, list, records, rows]
params:
  rows:
    type: table
    required: true
    doc: The rows
    key: optional
    columns:
      key: { type: text, optional: true, doc: "A key column, when the rows have one" }
  columns:     { type: columns, required: true, doc: "The columns: label, bind over a row as @.name, fmt, total" }
  title:       { type: text, default: Table, doc: The panel's title }
  search:      { type: boolean, default: true, doc: Whether the reader can search the rows }
  limit:       { type: integer, default: 200, min: 1, max: 5000, doc: The most rows drawn }
  total-label: { type: text, default: Total, doc: The label of the totals row }
  key:         { type: key, optional: true, doc: "A function key (F1 to F12) that scrolls to the table; none when not given" }
  code:        { type: text, optional: true, doc: "A short tag shown at the right of the panel's header, such as a mnemonic" }
  empty:       { type: text, optional: true, doc: "The words shown when there are no rows; the panel's own default when not given" }
  when:        { type: boolean, optional: true, doc: "A condition: the table is left out, with no empty box, where it is false" }
  span:        { type: integer, min: 1, max: 12, optional: true, doc: "The width in grid columns (1 to 12) on a wide screen" }
  where:       { type: "fn(record{}) -> boolean", optional: true, doc: "A condition each row must meet to be shown: lambda r: r.AMT_USD > 0" }
  id:          { type: id, optional: true, doc: "The panel's own id, exactly as written (not scoped to the use's as:), so function keys, events and links name it; when not given the id is <as>-table" }
panels:
  - id: table
    kind: table
    title: arg.title
    rows: arg.rows
    columns: "%{columns}"
    search: arg.search
    limit: arg.limit
    totalLabel: arg.total-label
    key: "%{key}"
    code: arg.code
    empty: arg.empty
    when: arg.when
    span: arg.span
    where: "arg.where(@)"
